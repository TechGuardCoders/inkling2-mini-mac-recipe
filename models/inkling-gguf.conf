ENGINE_TYPE=llama
# Inkling 2 Mini (Thinking Machines), AtomicChat AD-IQ3_XXS GGUF, on upstream llama.cpp
# Tuned for a 16 GB M4 Mac mini: 96K context, q8_0 KV cache, everything on the GPU.
MODEL_KEY=inkling-gguf
MODEL_LABEL="Inkling 2 Mini (AD-IQ3_XXS GGUF, llama.cpp)"
MODEL_ID=inkling-2-mini
MODEL_FILE=Inkling-2-Mini-AD-IQ3_XXS.gguf
MODEL_URL=https://huggingface.co/AtomicChat/Inkling-2-Mini-GGUF/resolve/0926b691a2d0c63821a039db62f86b63c38ca4a5/Inkling-2-Mini-AD-IQ3_XXS.gguf
MODEL_SHA256=4c0646204264788895b595704045a413f9ba13537aa8268b006428802bacaa9d
MODEL_BYTES=12576098272
ENGINE=llama-b12600
# GPU memory this config uses at full 96K (model 11,512 + KV 1,745 + compute ~620 MiB)
GPU_MB=13900
# -ub 32 is not a typo: compute buffers grow ~13 MiB per ubatch token at long context,
# and -ub 48 or more runs out of GPU memory at 96K on 16 GB (see docs/RECIPE.md).
SERVER_ARGS="-c 98304 -fa on -ctk q8_0 -ctv q8_0 -ub 32 -b 2048 -np 1 -ngl 99 --jinja"
# How the benchmark's quality check asks for a short answer
QA_KWARGS='{"reasoning_effort":"low"}'
